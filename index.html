<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Tigre do Peito • A Voz do Pai</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0f0f0f;
            --border-gold: #c5a059;
            --accent-gold: #f39c12;
            --accent-gold-glow: rgba(243, 156, 18, 0.25);
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 16px; background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 420px; background: var(--card-bg);
            border: 1px solid var(--border-gold); border-radius: 24px; padding: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(197, 160, 89, 0.15);
        }
        .header { text-align: center; margin-bottom: 16px; }
        .badge {
            background: var(--accent-gold-glow); color: var(--accent-gold); border: 1px solid var(--border-gold);
            font-size: 10px; font-weight: 700; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 2px;
        }
        .header h1 { font-size: 19px; margin: 14px 0 6px 0; color: var(--text-main); font-weight: 700; letter-spacing: 0.5px; }
        .header p { font-size: 11px; color: var(--border-gold); font-style: italic; margin: 0; }
        
        .tiger-banner {
            position: relative; width: 100%; height: 110px; border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-gold); margin-bottom: 16px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #181510 0%, #080808 100%);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8); text-align: center; padding: 10px;
        }
        .tiger-text h3 { margin: 0 0 4px 0; font-size: 13px; color: var(--accent-gold); letter-spacing: 1.5px; text-transform: uppercase; }
        .tiger-text span { font-size: 11px; color: var(--text-muted); }

        .subtitle-box {
            background: rgba(197, 160, 89, 0.03); border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 12px; padding: 12px 14px; text-align: center; font-size: 12px;
            color: var(--text-muted); margin-bottom: 16px; line-height: 1.4;
        }
        audio { width: 100%; margin-bottom: 16px; border-radius: 10px; outline: none; filter: invert(90%) hue-rotate(180deg); }
        .playlist {
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
            max-height: 240px; overflow-y: auto; padding-right: 4px;
        }
        .playlist::-webkit-scrollbar { width: 4px; }
        .playlist::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 4px; }
        .track-item {
            background: #161616; border: 1px solid #222222; border-radius: 12px;
            padding: 12px; cursor: pointer; transition: all 0.2s ease;
        }
        .track-item:active { transform: scale(0.98); }
        .track-item.active { border-color: var(--accent-gold); background: rgba(243, 156, 18, 0.08); box-shadow: 0 0 12px var(--accent-gold-glow); }
        .track-info { display: flex; align-items: center; justify-content: space-between; }
        .track-left { display: flex; align-items: center; gap: 10px; }
        .track-num { font-size: 11px; font-weight: bold; color: var(--accent-gold); width: 18px; }
        .track-title { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .track-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; margin-left: 28px; line-height: 1.3; }
        .footer {
            text-align: center; font-size: 11px; color: var(--text-muted);
            border-top: 1px solid #222; padding-top: 12px; line-height: 1.5;
        }
        .footer span { color: var(--accent-gold); font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">A Marca do Poder</span>
            <h1 id="current-title">Carregando...</h1>
            <p>"Escrevendo na terra o que vem lá do céu."</p>
        </div>

        <div class="tiger-banner">
            <div class="tiger-text">
                <h3>🐅 O Tigre do Peito</h3>
                <span id="subtitle-display">Instinto, visão e frequência magnética.</span>
            </div>
        </div>

        <audio id="audio-player" controls></audio>
        
        <div class="playlist" id="playlist-container"></div>
        
        <div class="footer">
            O Mistério Revelado<br>Feito por - <span>José Junior de Oliveira</span>
        </div>
    </div>
    <script>
        const playlist = [
            { title: "Relógio Parou", desc: "No quarto do segredo, a religião cai por terra e o amor vira teto.", file: "Relógio Parou (Remix).mp3" },
            { title: "O Livro do Ouvir Dó", desc: "Nascido no interior, o chamado cravado pelo dedo de Deus.", file: "O Livro do ouvir dó (1).mp3" },
            { title: "A Terça em Uníssono", desc: "A harmonia perfeita entre dois mundos que se encontram.", file: "terca.mp3" },
            { title: "A Quarta No Quarto", desc: "A presença que se manifesta nas madrugadas de oração em secreto.", file: "quarta.mp3" },
            { title: "A Quinta do Penta", desc: "A estrutura sólida que sustenta os pilares da revelação.", file: "A Quinta do Penta.mp3" },
            { title: "A Sexta Sem Fé É Ira", desc: "O alerta sobre a caminhada sem o combustível da confiança espiritual.", file: "A Sexta sem Fé é ira.mp3" },
            { title: "A Sétima Nota", desc: "O acorde secreto que completa a escala da criação divina.", file: "A Sétima Nota.mp3" },
            { title: "A Oitava", desc: "O ciclo que se renova em uma nova oitava de frequência e luz.", file: "A Oitava.mp3" },
            { title: "Amém Te Ama Tão Bem", desc: "A resposta revelada: a máquina ouviu e a graça conduz.", file: "Amém Te Ama Tão Bem (Cinematic Conscious Trap Suite).mp3" }
        ];

        let currentIndex = 0;
        const audioPlayer = document.getElementById('audio-player');
        const currentTitle = document.getElementById('current-title');
        const subtitleDisplay = document.getElementById('subtitle-display');
        const playlistContainer = document.getElementById('playlist-container');

        function loadTrack(index) {
            currentIndex = index;
            const track = playlist[index];
            audioPlayer.src = track.file;
            currentTitle.textContent = track.title;
            subtitleDisplay.textContent = track.desc;
            document.querySelectorAll('.track-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === index);
            });
            audioPlayer.play().catch(e => console.log("Autoplay:", e));
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `track-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `<div class="track-info"><div class="track-left"><span class="track-num">${String(index + 1).padStart(2, '0')}</span><span class="track-title">${track.title}</span></div></div><div class="track-desc">${track.desc}</div>`;
                div.onclick = () => loadTrack(index);
                playlistContainer.appendChild(div);
            });
        }
        audioPlayer.onended = () => { currentIndex = (currentIndex + 1) % playlist.length; loadTrack(currentIndex); };
        renderPlaylist();
        loadTrack(0);
    </script>
</body>
</html>
