<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Voz do Pai • Trilogia Musical</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --border-color: #333333;
            --accent-gold: #f39c12;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 420px; background: var(--card-bg);
            border: 1px solid var(--accent-gold); border-radius: 16px; padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header span {
            background: var(--accent-gold); color: #000; font-size: 11px; font-weight: 700;
            padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
        }
        .header h1 { font-size: 22px; margin: 12px 0 4px 0; color: var(--accent-gold); }
        .header p { font-size: 13px; color: var(--text-muted); font-style: italic; margin: 0; }
        .subtitle-box {
            background: rgba(243, 156, 18, 0.05); border: 1px dashed var(--accent-gold);
            border-radius: 10px; padding: 12px; text-align: center; font-size: 13px;
            color: var(--text-muted); margin-bottom: 20px; min-height: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        audio { width: 100%; margin-bottom: 20px; border-radius: 8px; }
        .playlist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .track-item {
            background: #1f1f1f; border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 16px; cursor: pointer; transition: all 0.3s ease;
        }
        .track-item:hover { border-color: var(--accent-gold); }
        .track-item.active { border-color: var(--accent-gold); background: rgba(243, 156, 18, 0.1); }
        .track-info { display: flex; align-items: baseline; gap: 10px; }
        .track-num { font-size: 14px; font-weight: bold; color: var(--accent-gold); }
        .track-title { font-size: 15px; font-weight: 600; }
        .track-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; margin-left: 24px; }
        .footer { text-align: center; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>A Voz do Pai • Trilogia Musical</span>
            <h1 id="current-title">Carregando...</h1>
            <p>"Escrevendo na terra o que vem lá do céu."</p>
        </div>
        <div class="subtitle-box" id="subtitle-display">🎵 Selecione uma faixa para iniciar...</div>
        <audio id="audio-player" controls></audio>
        <div class="playlist" id="playlist-container"></div>
        <div class="footer">O Mistério Revelado • José Junior de Oliveira & Fernando Rodrigo Vieira</div>
    </div>
    <script>
        const playlist = [
            { title: "Relógio Parou (Remix)", desc: "No quarto do segredo, a religião cai por terra e o amor vira teto.", file: "Relógio Parou (Remix) (Remix).mp3" },
            { title: "O Livro do Ouvir Dó", desc: "Nascido no interior, o chamado cravado pelo dedo de Deus.", file: "O Livro do ouvir dó (1).mp3" },
            { title: "Amém Te Ama Tão Bem", desc: "A resposta revelada: a máquina ouviu e a graça conduz.", file: "Amém Te Ama Tão Bem (Cinematic Conscious Trap Suite).mp3" }
        ];
        let currentIndex = 0;
        const audioPlayer = document.getElementById('audio-player');
        const currentTitle = document.getElementById('current-title');
        const subtitleDisplay = document.getElementById('subtitle-display');
        const playlistContainer = document.getElementById('playlist-container');

        function loadTrack(index) {
            currentIndex = index;
            const track = playlist[index];
            audioPlayer.src = track.file;
            currentTitle.textContent = track.title;
            subtitleDisplay.textContent = track.desc;
            document.querySelectorAll('.track-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === index);
            });
            audioPlayer.play().catch(e => console.log("Autoplay:", e));
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `track-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `<div class="track-info"><span class="track-num">${String(index + 1).padStart(2, '0')}</span><span class="track-title">${track.title}</span></div><div class="track-desc">${track.desc}</div>`;
                div.onclick = () => loadTrack(index);
                playlistContainer.appendChild(div);
            });
        }
        audioPlayer.onended = () => { currentIndex = (currentIndex + 1) % playlist.length; loadTrack(currentIndex); };
        renderPlaylist();
        loadTrack(0);
    </script>
</body>
</html>
